<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HLD Mock Interview — SDE-3</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
    --text:#e6edf3; --muted:#9aa7b4; --accent:#4f8cff; --accent2:#7c5cff;
    --edge:#48566a;
    --intv:#f0a742; --cand:#4fd1a1; --easy:#4fd1a1; --medium:#f0a742; --hard:#ff6b6b;
    --t-concept:#6ea8ff; --t-scaling:#f0a742; --t-durability:#4fd1a1; --t-failover:#ff6b6b; --t-capacity:#a78bfa;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;}
  header{padding:16px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--panel);position:sticky;top:0;z-index:20}
  header h1{font-size:19px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--accent);background:#222c38}
  .wrap{max-width:1360px;margin:0 auto;padding:22px}

  .setup h2{font-size:15px;color:var(--muted);font-weight:500;margin:26px 0 12px;text-transform:uppercase;letter-spacing:1px}
  .diff-row{display:flex;gap:12px;flex-wrap:wrap}
  .diff{flex:1;min-width:180px;border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;background:var(--panel);transition:.15s}
  .diff:hover{border-color:var(--accent)}
  .diff.sel{border-color:var(--accent);background:#1a2634;box-shadow:0 0 0 1px var(--accent)}
  .diff .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
  .diff h3{margin:0 0 6px;font-size:16px}.diff p{margin:0;color:var(--muted);font-size:13px}
  .prob-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .prob{border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;background:var(--panel);transition:.15s}
  .prob:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .prob h3{margin:0 0 8px;font-size:16px}.prob p{margin:0;color:var(--muted);font-size:13px}
  .prob .tag{display:inline-block;margin-top:12px;font-size:11px;color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
  .prob .cat{display:block;font-size:10px;color:var(--accent2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;font-weight:600}

  .stepper{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .step{flex:1;min-width:150px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.15s;display:flex;gap:10px;align-items:center}
  .step:hover{border-color:var(--accent)}
  .step.on{border-color:var(--accent);background:#1a2634;box-shadow:0 0 0 1px var(--accent)}
  .step.done .num{background:var(--cand);color:#0e1116}
  .step .num{width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .step.on .num{background:var(--accent);color:#fff;border-color:var(--accent)}
  .step .lbl{font-size:12.5px;font-weight:600;line-height:1.25}
  .step .sub{font-size:10.5px;color:var(--muted)}

  .stage{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:start}
  @media(max-width:1000px){.stage{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .card .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .card .hd h3{margin:0;font-size:14px;font-weight:600}.card .hd .hint{font-size:12px;color:var(--muted)}
  .diagram{padding:14px 12px 6px}
  svg{width:100%;height:auto;display:block}
  .node{cursor:pointer}.node rect{transition:.18s}
  .node .box{fill:url(#nodegrad);stroke:var(--line);stroke-width:1.25;filter:url(#nodeshadow)}
  .node:hover .box{stroke:var(--accent);stroke-width:1.75}
  .node.active .box{stroke:var(--accent);stroke-width:2.25;fill:#1e2a3a}
  .node.done .box{stroke:var(--cand)}
  .node .stripe{transition:.18s}
  .node text{fill:var(--text);font-size:12px;font-weight:600;letter-spacing:.15px;pointer-events:none}
  .node .sub{fill:var(--muted);font-size:9.5px;font-weight:500;letter-spacing:.1px}
  .node .ico{pointer-events:none}
  .edge{stroke:var(--edge);stroke-width:1.6;fill:none;marker-end:url(#arr);stroke-linecap:round}
  .elabel{fill:var(--muted);font-size:9px;font-weight:600;letter-spacing:.3px;pointer-events:none;text-transform:uppercase}
  .elabel-bg{fill:var(--panel);stroke:var(--line);stroke-width:1;rx:5}
  .legend{display:flex;gap:12px;flex-wrap:wrap;padding:2px 12px 10px;margin-top:2px}
  .legend .lg{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
  .legend .lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes edgein{from{opacity:0}to{opacity:1}}
  .node.new{animation:pop .5s cubic-bezier(.2,1.3,.5,1) both;transform-box:fill-box;transform-origin:center}
  .node.new .box{stroke:var(--accent2);stroke-width:2.25}
  .edge.new{animation:edgein .6s ease .2s both}
  @keyframes flowpulse{0%,100%{stroke:var(--accent2);stroke-width:2}50%{stroke:#a99bff;stroke-width:3.5}}
  .node.flowon .box{animation:flowpulse 1s ease-in-out infinite;fill:#221a3a}
  .pulse{fill:#c3b6ff;filter:drop-shadow(0 0 6px var(--accent2))}
  @keyframes pulsegrow{0%{r:3}50%{r:6}100%{r:3}}
  .difftools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:0 10px 8px}
  .difftools .lab{font-size:11px;color:var(--muted);margin-left:4px}
  .difftools button{font-size:11.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .difftools button:hover:not(:disabled){border-color:var(--accent);background:#222c38}
  .difftools button:disabled{opacity:.5;cursor:not-allowed}
  .difftools button.flowbtn{border-color:rgba(124,92,255,.4);color:#c3b6ff}
  .difftools button.wtbtn{border-color:var(--accent2);background:linear-gradient(180deg,#241d3d,#1a1530);color:#d8ccff;font-weight:600}
  .difftools button.wtbtn:hover{background:linear-gradient(180deg,#2c2350,#221a3d);border-color:#8a6cff}
  .difftools button.on{border-color:var(--accent);background:#1c2836}
  .schemaBox{padding:6px 12px 12px}
  .schemaBox .tbl{margin-bottom:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .schemaBox .tname{background:#12161d;padding:7px 11px;font-size:12.5px;font-weight:600;color:#c3b6ff;display:flex;justify-content:space-between}
  .schemaBox .tname .pk{color:var(--muted);font-weight:400;font-size:11px}
  .schemaBox table{width:100%;border-collapse:collapse;font-size:11.5px}
  .schemaBox th,.schemaBox td{text-align:left;padding:5px 9px;border-top:1px solid var(--line);vertical-align:top}
  .schemaBox th{color:var(--muted);font-weight:500}
  .schemaBox td.col{color:#e6edf3;font-family:ui-monospace,Menlo,monospace}
  .schemaBox td.typ{color:#7ad;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
  .schemaBox td.note{color:var(--muted)}
  .schemaBox .rows{margin-top:2px}
  .schemaBox .rows caption{caption-side:top;text-align:left;font-size:10.5px;color:var(--muted);padding:6px 9px 2px}
  .schemaBox .rows td{font-family:ui-monospace,Menlo,monospace;color:#cdd8e3;font-size:11px}
  .schemaBox .dbreq{padding:8px 11px;font-size:12px;color:var(--text);border-top:1px solid var(--line);background:#0e1116}
  .schemaBox td .pick{color:var(--cand);font-weight:600}
  .schemaBox td .rej{color:var(--muted)}
  .schemaBox .dbsec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;color:#cdd8e3;line-height:1.6}
  .schemaBox .dbsec h6{margin:0 0 6px;font-size:12px;color:#c3b6ff;display:flex;align-items:center;gap:6px;font-weight:600}
  .schemaBox .dbsec.decision{border-color:#234b3a;background:#12211b}
  .schemaBox .dbsec.decision h6{color:var(--cand)}
  .schemaBox .dbsec code{background:#0e1116;padding:1px 5px;border-radius:4px;color:#7ad;font-size:11.5px}
  .bubble.flow .body{border-left-color:var(--accent2);background:#161327}
  .bubble.flow .body ol{margin:4px 0;padding-left:20px}.bubble.flow .body li{margin:5px 0}
  .bubble.flow .body .comp{color:#c3b6ff;font-weight:600}
  .bubble.model .body{border-left-color:#7ad;background:#0f1a22}
  .bubble.model .who{color:#7ad}
  .answerbox{margin:4px 0 16px;border:1px solid var(--accent2);border-radius:10px;padding:10px;background:#141026;display:flex;gap:8px}
  .answerbox textarea{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font-size:13px;min-height:46px;font-family:inherit;resize:vertical}
  .answerbox textarea:focus{outline:none;border-color:var(--accent)}
  .answerbox .go{background:var(--accent2);border:none;color:#fff;border-radius:8px;padding:0 14px;cursor:pointer;font-weight:600;white-space:nowrap}
  .answerbox .go:hover{background:#6a4ce0}
  .quizprompt{margin:-2px 0 16px}
  .quizprompt button{background:none;border:1px dashed var(--accent2);color:#c3b6ff;border-radius:8px;padding:7px 13px;cursor:pointer;font-size:12.5px}
  .quizprompt button:hover{background:#1a1430}
  .askbox .quizme{background:none;border:1px dashed var(--accent2);color:#c3b6ff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:5px}
  .askbox .quizme:hover{background:#1a1430}

  .panel{margin-top:18px}
  .panel .empty{color:var(--muted);font-size:14px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}
  .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .phead h4{margin:0;font-size:15px}.counter{font-size:12px;color:var(--muted)}
  .reqcol{margin-bottom:14px}
  .reqcol h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .reqli{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .reqli i{color:var(--accent2);margin-top:2px}
  .item{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:10px;cursor:pointer;margin-bottom:8px;font-size:13.5px;display:flex;gap:9px;align-items:flex-start;transition:.15s}
  .item:hover:not(:disabled){border-color:var(--accent);background:#222c38}
  .item:disabled{opacity:.5;cursor:not-allowed}
  .item .qt{flex:1}.item .turns{font-size:10px;color:var(--muted);white-space:nowrap;margin-top:2px}
  .chip{font-size:10px;padding:2px 7px;border-radius:6px;flex-shrink:0;margin-top:1px;font-weight:600;white-space:nowrap}
  .chip.easy{background:rgba(79,209,161,.15);color:var(--easy)}.chip.medium{background:rgba(240,167,66,.15);color:var(--medium)}.chip.hard{background:rgba(255,107,107,.15);color:var(--hard)}
  .chip.req{background:rgba(124,92,255,.15);color:var(--accent2)}
  .tchip{font-size:10px;padding:2px 7px;border-radius:6px;flex-shrink:0;margin-top:1px;white-space:nowrap;border:1px solid}
  .tchip.concept{color:var(--t-concept);border-color:rgba(110,168,255,.4)}
  .tchip.scaling{color:var(--t-scaling);border-color:rgba(240,167,66,.4)}
  .tchip.durability{color:var(--t-durability);border-color:rgba(79,209,161,.4)}
  .tchip.failover{color:var(--t-failover);border-color:rgba(255,107,107,.4)}
  .tchip.capacity{color:var(--t-capacity);border-color:rgba(167,139,250,.4)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
  .fchip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);cursor:pointer;background:none}
  .fchip.on{border-color:var(--accent);color:var(--text);background:#1c2836}
  .compbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .compbtn{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
  .compbtn.on{border-color:var(--accent);background:#1c2836}
  .compbtn.done{border-color:var(--cand)}

  /* study-notes (deep dive) mode */
  .modetoggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:13px}
  .modetoggle .mt{background:var(--panel2);color:var(--muted);border:none;padding:7px 13px;font-size:12.5px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .modetoggle .mt.on{background:#1c2836;color:var(--text)}
  .modetoggle .mt+.mt{border-left:1px solid var(--line)}
  .modetoggle .mt:hover:not(.on){color:var(--text)}
  .study{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
  .sect{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .sect>h5{margin:0;padding:9px 13px;font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px;background:#12161d;border-bottom:1px solid var(--line)}
  .sect .body{padding:11px 13px;font-size:13px;color:#cdd8e3;line-height:1.62}
  .sect .body p{margin:0 0 8px}.sect .body p:last-child{margin:0}
  .sect .body ul{margin:0;padding-left:18px}.sect .body li{margin:6px 0}
  .sect .body code{background:#0e1116;padding:1px 6px;border-radius:5px;color:#7ad;font-size:12px;font-family:ui-monospace,Menlo,monospace}
  .sect .body strong{color:#fff;font-weight:600}
  .sect.role>h5{color:var(--t-concept)} .sect.capacity>h5{color:var(--t-capacity)}
  .sect.data>h5{color:#7ad} .sect.scaling>h5{color:var(--t-scaling)}
  .sect.failures>h5{color:var(--t-failover)} .sect.tradeoffs>h5{color:var(--accent2)} .sect.probes>h5{color:var(--cand)}
  .captbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .captbl td{padding:7px 13px;border-top:1px solid var(--line);vertical-align:top}
  .captbl tr:first-child td{border-top:none}
  .captbl td.m{color:var(--muted);white-space:nowrap;width:36%}
  .captbl td.v{color:#e6edf3;font-family:ui-monospace,Menlo,monospace}
  .captbl td.v .n{color:var(--muted);font-family:inherit}
  .fail{border-top:1px solid var(--line);padding:10px 13px}
  .fail:first-child{border-top:none}
  .fail .ft{font-weight:700;color:#ff8f8f;font-size:12.5px;margin-bottom:5px;display:flex;gap:7px;align-items:baseline}
  .fail .frow{font-size:12.5px;color:#cdd8e3;margin:3px 0;line-height:1.55}
  .fail .frow b{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.5px;margin-right:7px;display:inline-block;min-width:66px}
  .fail .frow.mit b{color:var(--cand)}
  .trade{border-top:1px solid var(--line);padding:9px 13px;font-size:12.5px;color:#cdd8e3;line-height:1.55}
  .trade:first-child{border-top:none}
  .trade .tw{color:#fff;font-weight:600}
  .probe{display:flex;gap:8px;align-items:flex-start;padding:8px 13px;border-top:1px solid var(--line);font-size:12.5px;color:#cdd8e3;line-height:1.5}
  .probe:first-child{border-top:none}
  .probe i{color:var(--cand);margin-top:2px;flex-shrink:0}

  /* ---- request walkthrough overlay ---- */
  .wt-ov{position:fixed;inset:0;background:rgba(6,9,14,.78);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fade .2s ease}
  .wt-modal{width:min(1180px,95vw);height:min(90vh,860px);background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6)}
  .wt-head{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1a2230,#141a24)}
  .wt-head h3{margin:0;font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
  .wt-head h3 i{color:var(--accent2)}
  .wt-head .sub{color:var(--muted);font-size:12px}
  .wt-head .sp{flex:1}
  .wt-head .stepn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 11px}
  .wt-x{background:var(--panel2);border:1px solid var(--line);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
  .wt-x:hover{color:#fff;border-color:var(--accent)}
  .wt-body{flex:1;display:flex;min-height:0}
  .wt-diag{width:46%;border-right:1px solid var(--line);background:radial-gradient(circle at 40% 30%,#141b26,#0d1119);display:flex;flex-direction:column;min-width:0}
  .wt-diag .d{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}
  .wt-diag svg{width:100%;height:100%;max-height:100%}
  .wt-diag .cap{padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:center}
  .wt-diag .edge{stroke:var(--edge);stroke-width:1.6;fill:none;opacity:.4;marker-end:url(#arr)}
  .wt-diag .edge.wt-hot{stroke:var(--accent2);stroke-width:2.6;opacity:1;marker-end:url(#arrhot)}
  .wt-diag .elabel-bg{fill:#0d1119;opacity:.85}
  .wt-diag .elabel{fill:#8aa0b6;font-size:9px;text-transform:uppercase;letter-spacing:.4px}
  .wt-diag .node text{fill:#e7eef6;font-size:12px;font-weight:600;pointer-events:none}
  .wt-diag .node .sub{fill:#7d8ea0;font-size:9.5px;font-weight:500}
  .wt-diag .node .box{fill:url(#nodegrad);stroke:var(--line);stroke-width:1.2;filter:url(#nodeshadow)}
  .wt-diag .node{opacity:.42;transition:opacity .3s}
  .wt-diag .node.on{opacity:1}
  .wt-diag .node.on .box{stroke:var(--accent2);stroke-width:2.2}
  .wt-diag .node.done .box{stroke:#2f6f52}
  .wt-pulse{fill:#c3b6ff;filter:drop-shadow(0 0 6px var(--accent2))}
  .wt-side{flex:1;display:flex;flex-direction:column;min-width:0}
  .wt-scroll{flex:1;overflow-y:auto;padding:18px 20px}
  .wt-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent2);background:#1e1a33;border:1px solid #2f2a4d;border-radius:20px;padding:3px 10px;margin-bottom:10px}
  .wt-title{font-size:17px;font-weight:700;color:#fff;margin:0 0 8px}
  .wt-narr{font-size:13.5px;line-height:1.62;color:#d3dde7;margin-bottom:16px}
  .wt-narr code{background:#0e1117;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px;color:#b8c7d6}
  .wt-card{border:1px solid var(--line);border-left-width:3px;border-radius:9px;margin-bottom:12px;overflow:hidden;background:#10151d}
  .wt-card>.h{display:flex;align-items:center;gap:7px;padding:8px 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .wt-card>.h i{font-size:14px}
  .wt-card .tx{padding:0 12px 11px;font-size:12.5px;line-height:1.55;color:#c7d2dd}
  .wt-card pre{margin:0;padding:11px 12px;background:#0b0e14;border-top:1px solid var(--line);overflow-x:auto;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:11.7px;line-height:1.55;color:#cfe3d6;white-space:pre;tab-size:2}

  .askbox{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#12161d}

  .bubble.intv .av{background:var(--intv)}.bubble.intv .who{color:var(--intv)}
  .bubble.cand .av{background:var(--cand)}.bubble.cand .who{color:var(--cand)}

  .res a:last-child{border-bottom:none}.res a:hover{color:#a9e2ff;text-decoration:underline}
  .res a .d{color:var(--muted);font-size:11px}

<body>
<header>
  <div>
    <h1>HLD Mock Interview <span style="color:var(--muted);font-weight:400">— SDE-3 System Design</span></h1>
    <div class="sub" id="subtitle">Pick a difficulty and a problem to begin. You are the interviewer.</div>
  </div>
  <div style="display:flex;gap:10px">
    <button class="btn" id="mockBtn" style="display:none">Mock test</button>
    <button class="btn" id="resetBtn" style="display:none">Reset problem</button>
    <button class="btn" id="changeBtn" style="display:none">Change problem</button>
  </div>
</header>

<div class="wrap">
  <div id="setup" class="setup"></div>
  <div id="interview" style="display:none"></div>
</div>

<script src="problems/url.js"></script>
<script src="problems/feed.js"></script>
<script src="problems/chat.js"></script>
<script src="problems/ratelimiter.js"></script>
<script src="problems/video.js"></script>
<script src="problems/proximity.js"></script>
<script src="problems/gdocs.js"></script>
<script src="problems/filesync.js"></script>
<script src="problems/ticketmaster.js"></script>
<script src="problems/crawler.js"></script>
<script src="problems/adclick.js"></script>
<script src="problems/scheduler.js"></script>
<script src="problems/inventory.js"></script>
<script src="problems/hotel.js"></script>

<script>
const DATA = window.DATA || {};
const DIFF_INFO = {
  easy:{name:"Easy",dot:"var(--easy)",desc:"Warm-up. Fundamentals and 'what/why' probes."},
  medium:{name:"Medium",dot:"var(--medium)",desc:"Standard SDE-3 bar. Trade-off conversations."},
  hard:{name:"Hard",dot:"var(--hard)",desc:"Senior deep-dives — scale, durability, failover."},
};
const DIFF_ALLOWED = {easy:["easy"], medium:["easy","medium"], hard:["easy","medium","hard"]};
const TAGS = {concept:{icon:"ti-bulb"},capacity:{icon:"ti-calculator"},scaling:{icon:"ti-trending-up"},durability:{icon:"ti-database"},failover:{icon:"ti-alert-triangle"}};
const MAX_FOLLOWUPS = 10;
const PHASE_META = [
  {n:1,lbl:"Requirements",sub:"functional + NFR",key:"requirements"},
  {n:2,lbl:"Functional HLD",sub:"build per requirement",key:"reqBuild"},
  {n:3,lbl:"System deep dives",sub:"evolve the architecture",key:"systemDives"},
  {n:4,lbl:"Component deep dives",sub:"drill each box",key:"q"},
];

let state = {diff:null, prob:null, phase:1, activeNode:null, asked:{}, answeredCount:{},
  reqDone:{}, diveDone:{}, playing:false, revealed:new Set(), justRevealed:new Set(), filter:null,
  flowNode:null, showSchema:false, showDbDoc:false, studyMode:true,
  wt:{open:false, flow:null, i:0, playing:false, timer:null, seen:new Set()}};

const setupEl=document.getElementById('setup'), interviewEl=document.getElementById('interview'), subtitle=document.getElementById('subtitle');

function idsOf(p){return p.nodes.map(n=>n.id);}
function basicSet(p){return new Set(p.basic&&p.basic.length?p.basic:(p.core&&p.core.length?p.core:idsOf(p)));}
function functionalSet(p){const s=basicSet(p);(p.reqBuild||[]).forEach(r=>(r.reveal||[]).forEach(id=>s.add(id)));return s;}
function availablePhases(p){return PHASE_META.filter(m=> m.key==='q' ? Object.keys(p.q||{}).length : (m.key==='requirements'? (p.requirements&&(p.requirements.functional||p.requirements.nonFunctional)) : (p[m.key]&&p[m.key].length)) );}

/* ---------------- setup ---------------- */
function renderSetup(){
  interviewEl.style.display='none'; setupEl.style.display='block';
  document.getElementById('mockBtn').style.display='none'; document.getElementById('resetBtn').style.display='none'; document.getElementById('changeBtn').style.display='none';
  subtitle.textContent="Pick a difficulty and a problem to begin. You are the interviewer.";
  let html=`<div class="setup"><h2>1 · Choose difficulty</h2><div class="diff-row">`;
  for(const[k,v]of Object.entries(DIFF_INFO)) html+=`<div class="diff ${state.diff===k?'sel':''}" data-diff="${k}"><h3><span class="dot" style="background:${v.dot}"></span>${v.name}</h3><p>${v.desc}</p></div>`;
  html+=`</div><h2>2 · Choose a problem</h2><div class="prob-grid">`;
  for(const[k,v]of Object.entries(DATA)) html+=`<div class="prob" data-prob="${k}">${v.cat?`<span class="cat">${v.cat}</span>`:''}<h3>${v.title}</h3><p>${v.blurb}</p><span class="tag">${v.nodes.length} components · ${countF(k)} deep-dives</span></div>`;
  html+=`</div></div>`;
  setupEl.innerHTML=html;
  setupEl.querySelectorAll('.diff').forEach(el=>el.onclick=()=>{state.diff=el.dataset.diff;renderSetup();});
  setupEl.querySelectorAll('.prob').forEach(el=>el.onclick=()=>{ if(!state.diff){flashDiff();return;} startInterview(el.dataset.prob); });
}
function flashDiff(){const h=setupEl.querySelector('h2');h.style.color='var(--hard)';h.textContent='1 · Choose difficulty  ← pick one first';setTimeout(()=>{h.style.color='';h.textContent='1 · Choose difficulty';},1400);}
function countF(pk){let n=0;const q=DATA[pk].q||{};for(const c in q)n+=q[c].length;return n;}

/* ---------------- interview shell ---------------- */
function startInterview(pk){
  state.prob=pk; state.activeNode=null; state.asked={}; state.answeredCount={}; state.reqDone={}; state.diveDone={};
  state.playing=false; state.filter=null; state.justRevealed=new Set();
  const p=DATA[pk];
  const avail=availablePhases(p);
  state.phase=avail[0].n;
  state.revealed=new Set(basicSet(p));
  setupEl.style.display='none'; interviewEl.style.display='block';
  document.getElementById('mockBtn').style.display='inline-block'; document.getElementById('resetBtn').style.display='inline-block'; document.getElementById('changeBtn').style.display='inline-block';
  subtitle.innerHTML=`<strong>${p.title}</strong> · Difficulty: <span style="color:${DIFF_INFO[state.diff].dot}">${DIFF_INFO[state.diff].name}</span>`;
  interviewEl.innerHTML=`
    <div id="stepper" class="stepper"></div>
    <div class="stage">
      <div>
        <div class="card"><div class="hd"><h3>High-level design</h3><span class="hint" id="dhint"></span></div>
          <div class="difftools" id="difftools"></div>
          <div class="diagram" id="diagram"></div>
          <div class="schemaBox" id="schemaBox" style="display:none"></div>
          <div class="schemaBox" id="dbDocBox" style="display:none"></div>
        </div>
        <div class="panel" id="panel"></div>
        <div class="tip" id="ptip"></div>
      </div>
      <div class="card"><div class="hd"><h3>Interview transcript</h3><span class="hint" id="tcount"></span></div><div class="transcript" id="transcript"></div></div>
    </div>`;
  renderStepper(); renderDifftools(); renderDiagram(); renderPanel();
  addBubble('intv',p.prompt); addBubble('cand',p.opening);
}
function renderStepper(){
  const p=DATA[state.prob], avail=availablePhases(p).map(m=>m.n);
  const done={1:Object.keys(state.reqDone).length>0||state.phase>1,2:(p.reqBuild&&Object.keys(state.reqDone).length>=p.reqBuild.length),3:(p.systemDives&&Object.keys(state.diveDone).length>=p.systemDives.length),4:false};
  let html='';
  PHASE_META.forEach(m=>{ if(!avail.includes(m.n))return;
    html+=`<div class="step ${state.phase===m.n?'on':''} ${done[m.n]?'done':''}" data-p="${m.n}"><div class="num">${done[m.n]?'<i class="ti ti-check"></i>':m.n}</div><div><div class="lbl">${m.lbl}</div><div class="sub">${m.sub}</div></div></div>`;
  });
  document.getElementById('stepper').innerHTML=html;
  document.querySelectorAll('#stepper .step').forEach(el=>el.onclick=()=>{ if(state.playing)return; setPhase(parseInt(el.dataset.p)); });
}
function setPhase(n){
  const p=DATA[state.prob];
  state.phase=n; state.filter=null;
  let target;
  if(n<=1) target=basicSet(p);
  else if(n===2) target=new Set([...state.revealed,...basicSet(p)]);
  else if(n===3) target=new Set([...state.revealed,...functionalSet(p)]);
  else target=new Set(idsOf(p));
  state.justRevealed=new Set([...target].filter(id=>!state.revealed.has(id)));
  state.revealed=target;
  if(n!==4) state.activeNode=null;
  renderStepper(); renderDiagram(); renderPanel();
  if(state.justRevealed.size) setTimeout(()=>{state.justRevealed=new Set();},700);
}

/* ---------------- toolbar: data model + walk-the-flow ---------------- */
function renderDifftools(){
  const p=DATA[state.prob], el=document.getElementById('difftools'); if(!el)return;
  let html='';
  if(p.schema&&p.schema.tables&&p.schema.tables.length)
    html+=`<button id="schemaBtn" class="${state.showSchema?'on':''}"><i class="ti ti-table"></i> Data model</button>`;
  if(p.dbDoc)
    html+=`<button id="dbDocBtn" class="${state.showDbDoc?'on':''}"><i class="ti ti-database-cog"></i> DB decision</button>`;
  if(p.flows&&p.flows.length){
    html+=`<span class="lab">Walk a flow:</span>`;
    p.flows.forEach(f=>{ html+=`<button class="flowbtn" data-flow="${f.id}" ${state.playing?'disabled':''}><i class="ti ti-player-play"></i> ${f.name}</button>`; });
  }
  if(p.deepFlows&&p.deepFlows.length){
    const scaleFlows=p.deepFlows.filter(f=>f.kind==='scale');
    const reqFlows=p.deepFlows.filter(f=>f.kind!=='scale');
    if(scaleFlows.length){
      html+=`<span class="lab scalelab"><i class="ti ti-trending-up"></i> Scaling journey — why each upgrade:</span>`;
      scaleFlows.forEach(f=>{ html+=`<button class="flowbtn wtbtn scalebtn" data-wt="${f.id}"><i class="ti ti-stairs-up"></i> ${f.name}</button>`; });
    }
    if(reqFlows.length){
      html+=`<span class="lab" style="color:var(--accent2)"><i class="ti ti-zoom-scan"></i> Request walkthrough:</span>`;
      reqFlows.forEach(f=>{ html+=`<button class="flowbtn wtbtn" data-wt="${f.id}"><i class="ti ti-route"></i> ${f.name}</button>`; });
    }
  }
  if(!html) html=`<span class="lab">Click a component below to drill in.</span>`;
  el.innerHTML=html;
  const sb=document.getElementById('schemaBtn'); if(sb) sb.onclick=toggleSchema;
  const db=document.getElementById('dbDocBtn'); if(db) db.onclick=toggleDbDoc;
  el.querySelectorAll('.flowbtn[data-flow]').forEach(b=>b.onclick=()=>{ if(!state.playing) walkFlow(b.dataset.flow); });
  el.querySelectorAll('.wtbtn').forEach(b=>b.onclick=()=>openWalk(b.dataset.wt));
}
function toggleSchema(){ state.showSchema=!state.showSchema; const box=document.getElementById('schemaBox');

function walkFlow(flowId){
  const p=DATA[state.prob], flow=(p.flows||[]).find(f=>f.id===flowId); if(!flow)return;
  const steps=(flow.steps||[]).filter(s=>!s.requires||s.requires.every(id=>state.revealed.has(id)));
  state.playing=true; renderStepper(); renderDifftools(); renderPanel();
  addBubble('intv', `Walk me through the <strong>${flow.name}</strong> as the design stands right now.`);
  const cand=document.createElement('div'); cand.className='bubble cand flow';
  cand.innerHTML=`<div class="who"><span class="av">C</span>Candidate</div><div class="body"><p>Sure — tracing it through the current architecture:</p><ol id="flowol"></ol></div>`;
  const t=document.getElementById('transcript'); t.appendChild(cand); t.scrollTop=t.scrollHeight;
  const ol=cand.querySelector('#flowol');
  let i=0, prev=null;
  const step=()=>{
    if(i>=steps.length){ state.flowNode=null; renderDiagram(); state.playing=false; renderStepper(); renderDifftools(); renderPanel(); return; }
    const s=steps[i];
    state.flowNode=s.node||null; renderDiagram();
    const compName = s.node ? (p.nodes.find(n=>n.id===s.node)||{}).name : '';
    const li=document.createElement('li');
    li.innerHTML=(compName?`<span class="comp">${compName}:</span> `:'')+s.text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    ol.appendChild(li); t.scrollTop=t.scrollHeight;
    const from=prev, to=s.node; if(s.node) prev=s.node; i++;
    const advance=(d)=>setTimeout(step, d);
    if(from && to && from!==to){ travelPulse(from,to,540,()=>advance(300)); }
    else advance(760);
  };
  step();
}
// animate a glowing "request" dot travelling from one component to another along the wire
function pulseAlong(svg,sx,sy,ex,ey,ms,cls,done){
  const finish=()=>{ if(done) done(); };
  if(!svg){ finish(); return; }
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('r','5'); c.setAttribute('class',cls||'pulse'); c.setAttribute('cx',sx); c.setAttribute('cy',sy);
  svg.appendChild(c);
  const t0=performance.now();
  const tick=(now)=>{
    const k=Math.min(1,(now-t0)/ms), ease=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    c.setAttribute('cx', sx+(ex-sx)*ease); c.setAttribute('cy', sy+(ey-sy)*ease);
    c.setAttribute('r', 4+2*Math.sin(k*Math.PI));
    if(k<1) requestAnimationFrame(tick); else { c.remove(); finish(); }
  };
  requestAnimationFrame(tick);
}
function travelPulse(fromId,toId,ms,done){
  const svg=document.querySelector('#diagram svg'), p=DATA[state.prob];
  const A=(p.nodes||[]).find(n=>n.id===fromId), B=(p.nodes||[]).find(n=>n.id===toId);
  if(!svg||!A||!B||!state.revealed.has(fromId)||!state.revealed.has(toId)){ if(done)done(); return; }
  const cellW=134, cellH=56, hw=cellW/2, hh=cellH/2;
  const ax=A.x+hw, ay=A.y+hh, bx=B.x+hw, by=B.y+hh;
  const s=borderPt(ax,ay,bx,by,hw,hh,2), e=borderPt(bx,by,ax,ay,hw,hh,5);
  pulseAlong(svg,s.x,s.y,e.x,e.y,ms,'pulse',done);
}

/* ---------------- request walkthrough (end-to-end) ---------------- */
const WT_ICON={wire:'ti-arrow-bounce',query:'ti-database',route:'ti-route',repl:'ti-copy',note:'ti-info-circle',gotcha:'ti-alert-triangle',queue:'ti-stack-2',scale:'ti-calculator',pain:'ti-flame',fix:'ti-tool',win:'ti-circle-check',key:'ti-key',host:'ti-server'};
const WT_KW=/\b(SELECT|INSERT|INTO|VALUES|UPDATE|SET|DELETE|FROM|WHERE|AND|OR|ORDER BY|GROUP BY|LIMIT|OFFSET|RETURNING|ON CONFLICT|DO NOTHING|DO UPDATE|LEFT JOIN|INNER JOIN|JOIN|HAVING|USING|BEGIN|COMMIT|ROLLBACK|WITH|CASE|WHEN|THEN|ELSE|END|NOT|NULL|IS|IN|ASC|DESC|FOR UPDATE|SKIP LOCKED|COALESCE|NOW|EXISTS|BETWEEN|DISTINCT|COUNT|EXPLAIN|ANALYZE)\b/g;
function wtEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function wtHi(code){
  let s=wtEsc(code);
  s=s.replace(/(--[^\n]*)/g,'<span class="cm">$1</span>');
  s=s.replace(/('[^'\n]*')/g,'<span class="st">$1</span>');
  s=s.replace(WT_KW,'<span class="kw">$1</span>');
  return s;
}
function wtInline(s){ return String(s||'').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+?)`/g,'<code>$1</code>'); }
// one queue message chip (Kafka log entry or SQS message)
function wtQmsg(m,kind){
  const st=(kind==='sqs')?({inflight:'inflt',visible:'',deleted:'done'}[m.s]||''):'';
  const cls=['msg', m.hi?'on':'', st].filter(Boolean).join(' ');
  return `<div class="${cls}">${wtEsc(String(m.v))}${m.tag?`<span class="mtag">${wtEsc(m.tag)}</span>`:''}</div>`;
}
// render a per-step state snapshot: DB tables (highlight changed rows) + queue partitions (offsets / visibility)
function wtStateHTML(snap){
  if(!snap) return '';
  let body='';
  (snap.tables||[]).forEach(tb=>{
    const head=(tb.cols||[]).map(c=>`<th>${wtEsc(c)}</th>`).join('');
    const rows=(tb.rows||[]).map(r=>{
      const cells=(r.c||[]).map((v,idx)=>`<td>${wtInline(String(v))}${idx===0&&r.tag?`<span class="rtag ${r.tag==='deleted'||r.tag==='removed'?'del':''}">${wtEsc(r.tag)}</span>`:''}</td>`).join('');
      const rc=[r.hi?'chg':'', r.gone?'gone':''].filter(Boolean).join(' ');
      return `<tr class="${rc}">${cells}</tr>`;
    }).join('');
    body+=`<div class="wt-tbl"><div class="tt"><i class="ti ti-database"></i>${wtEsc(tb.name)}${tb.note?` · <span style='color:var(--muted);font-weight:400'>${wtInline(tb.note)}</span>`:''}</div><table><thead><tr>${head}</tr></thead><tbody>${rows||`<tr><td>&mdash;</td></tr>`}</tbody></table></div>`;
  });
  (snap.queues||[]).forEach(q=>{
    const kind=q.kind||'kafka';
    const parts=(q.parts||[]).map(pt=>{
      const msgs=(pt.msgs&&pt.msgs.length)?pt.msgs.map(m=>wtQmsg(m,kind)).join(''):`<div class="wt-empty">empty</div>`;
      const off=(kind==='kafka'&&(pt.commit!=null||pt.end!=null))?`<div class="off"><i class="ti ti-bookmark"></i>offset <b>${pt.commit!=null?pt.commit:'–'}</b> / end <b>${pt.end!=null?pt.end:'–'}</b></div>`:'';
      return `<div class="wt-part"><div class="pid"><span>${wtEsc(pt.id)}</span></div>${pt.key?`<div class="pk">${wtInline(pt.key)}</div>`:''}<div class="msgs">${msgs}</div>${off}</div>`;
    }).join('');
    const legend=(kind==='kafka')
      ? `<div class="wt-legend"><span>ordered head&rarr;tail · <b style='color:#f0c46b'>offset</b>=consumer group next-read · <b style='color:#f0c46b'>end</b>=latest appended</span></div>`
      : `<div class="wt-legend"><span><i style="background:#161d28;border:1px solid var(--line)"></i>visible</span><span><i style="background:#1c1810;border:1px dashed #6b551f"></i>in-flight (invisible)</span><span><i style="background:#161d28;opacity:.4"></i>deleted</span></div>`;
    body+=`<div class="wt-q"><div class="qh">${wtEsc(q.name)} <span class="kind ${kind}">${kind}</span>${q.by?`<span class="by">${wtInline(q.by)}</span>`:''}</div><div class="wt-parts">${parts}</div>${legend}</div>`;
  });
  if(!body) return '';
  const cap=snap.cap?`<div class="scap">${wtInline(snap.cap)}</div>`:'';
  const sh=snap.title?wtInline(snap.title):'State after this step';
  return `<div class="wt-state"><div class="sh"><i class="ti ti-layout-grid"></i>${sh}</div>${cap}<div class="sbody">${body}</div></div>`;
}

function openWalk(flowId){
  const p=DATA[state.prob], flow=(p.deepFlows||[]).find(f=>f.id===flowId); if(!flow)return;
  state.wt={open:true, flow, i:0, playing:false, timer:null, seen:new Set([0])};
  let ov=document.getElementById('wtov');
  if(!ov){ ov=document.createElement('div'); ov.id='wtov'; ov.className='wt-ov'; document.body.appendChild(ov); }
  ov.style.display='flex';

}
function closeWalk(){
  if(state.wt.timer){ clearTimeout(state.wt.timer); }

}
function wtGo(delta){
  const f=state.wt.flow; if(!f)return;

}
function wtJump(i){ state.wt.i=i; state.wt.seen.add(i); wtRender(); }
function wtStopPlay(){ state.wt.playing=false; if(state.wt.timer){clearTimeout(state.wt.timer);state.wt.timer=null;} const b=document.getElementById('wtplay'); if(b){b.innerHTML='<i class="ti ti-player-play"></i> Auto-play';} }

// glowing dot along a hop inside the overlay diagram
function wtPulse(fromId,toId){
  const svg=document.querySelector('#wtdiagram svg'), p=DATA[state.prob];
  const A=(p.nodes||[]).find(n=>n.id===fromId), B=(p.nodes||[]).find(n=>n.id===toId);
  if(!svg||!A||!B) return;
  const cellW=134, cellH=56, hw=cellW/2, hh=cellH/2;
  const s=borderPt(A.x+hw,A.y+hh,B.x+hw,B.y+hh,hw,hh,2), e=borderPt(B.x+hw,B.y+hh,A.x+hw,A.y+hh,hw,hh,5);
  const loop=()=>{ if(!state.wt.open) return; pulseAlong(svg,s.x,s.y,e.x,e.y,900,'wt-pulse',()=>{ state.wt._pt=setTimeout(loop,650); }); };
  if(state.wt._pt) clearTimeout(state.wt._pt);
  loop();
}
// focused diagram: all nodes shown, active node highlighted, active hop edge hot
function flowDiagramSVG(p,activeId,fromId,doneSet,opts){
  opts=opts||{}; const visible=opts.visible||null; const vok=id=>!visible||visible.has(id);
  const cellW=134, cellH=56, hw=cellW/2, hh=cellH/2;
  const maxX=Math.max(...p.nodes.map(n=>n.x))+cellW+40, maxY=Math.max(...p.nodes.map(n=>n.y))+cellH+30;
  const pos={}; p.nodes.forEach(n=>pos[n.id]={x:n.x,y:n.y});
  const isHot=(a,b)=>fromId&&activeId&&((a===fromId&&b===activeId)||(a===activeId&&b===fromId));
  let edges='', elabels='', hotFound=false;
  (p.edges.concat(opts.extraEdges||[])).forEach(e=>{ const [a,b,label]=e; const A=pos[a],B=pos[b]; if(!A||!B)return; if(!vok(a)||!vok(b))return;
    const s=borderPt(A.x+hw,A.y+hh,B.x+hw,B.y+hh,hw,hh,2), t=borderPt(B.x+hw,B.y+hh,A.x+hw,A.y+hh,hw,hh,5);
    const hot=isHot(a,b); if(hot)hotFound=true;
    edges+=`<line class="edge ${hot?'wt-hot':''}" x1="${s.x.toFixed(1)}" y1="${s.y.toFixed(1)}" x2="${t.x.toFixed(1)}" y2="${t.y.toFixed(1)}"></line>`;
    if(label&&hot){ const mx=(s.x+t.x)/2, my=(s.y+t.y)/2, w=label.length*5.4+12;
      elabels+=`<g><rect class="elabel-bg" x="${(mx-w/2).toFixed(1)}" y="${(my-8).toFixed(1)}" width="${w.toFixed(1)}" height="16" rx="5"></rect><text class="elabel" x="${mx.toFixed(1)}" y="${(my+3).toFixed(1)}" text-anchor="middle" style="fill:#c3b6ff">${label}</text></g>`; }
  });
  // if the hop isn't a declared edge, draw a dashed hot connector so the pulse has a track
  if(fromId&&activeId&&fromId!==activeId&&!hotFound){ const A=pos[fromId],B=pos[activeId];
    if(A&&B){ const s=borderPt(A.x+hw,A.y+hh,B.x+hw,B.y+hh,hw,hh,2), t=borderPt(B.x+hw,B.y+hh,A.x+hw,A.y+hh,hw,hh,5);
      edges+=`<line class="edge wt-hot" stroke-dasharray="4 4" x1="${s.x.toFixed(1)}" y1="${s.y.toFixed(1)}" x2="${t.x.toFixed(1)}" y2="${t.y.toFixed(1)}"></line>`; } }
  let nodes='';
  p.nodes.forEach(n=>{ if(!vok(n.id))return; const kind=kindOf(n);
    const cls=[(n.id===activeId?'on':''),(doneSet&&doneSet.has(n.id)&&n.id!==activeId?'done':'')].join(' ');
    nodes+=`<g class="node ${cls}" data-node="${n.id}">`+
      `<rect class="box" x="${n.x}" y="${n.y}" width="${cellW}" height="${cellH}" rx="11"></rect>`+
      `<rect class="stripe" x="${n.x+2.5}" y="${n.y+9}" width="3.5" height="${cellH-18}" rx="1.75" fill="${kind.c}"></rect>`+
      `<g class="ico" transform="translate(${n.x+12},${n.y+9}) scale(0.9)" fill="none" stroke="${kind.c}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[kind.k]}</g>`+
      `<text x="${n.x+34}" y="${n.y+21}">${n.name}</text>`+
      `<text class="sub" x="${n.x+13}" y="${n.y+42}">${n.sub}</text></g>`; });
  const defs=`<defs>`+
    `<linearGradient id="nodegrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232d3a"/><stop offset="1" stop-color="#171d27"/></linearGradient>`+
    `<filter id="nodeshadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000" flood-opacity="0.4"/></filter>`+
    `<marker id="arr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="var(--edge)"/></marker>`+
    `<marker id="arrhot" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="var(--accent2)"/></marker>`+
    `</defs>`;
  return `<svg viewBox="0 0 ${maxX} ${maxY}">${defs}${edges}${nodes}${elabels}</svg>`;
}
function wtRender(){
  const p=DATA[state.prob], f=state.wt.flow; if(!f)return;
  const i=state.wt.i, step=f.steps[i], n=f.steps.length;
  const activeId=step.node||step.to||null;
  const fromId=step.from||(i>0?(f.steps[i-1].node||f.steps[i-1].to):null)||null;
  const doneSet=new Set(); for(let k=0;k<i;k++){ const st=f.steps[k]; if(st.node)doneSet.add(st.node); if(st.to)doneSet.add(st.to); }
  const compName=activeId?((p.nodes.find(x=>x.id===activeId)||{}).name||''):'';
  const isScale=f.kind==='scale';
  const visible=step.live?new Set(step.live):(f.live?new Set(f.live):null);
  const extraEdges=(f.edges||[]).concat(step.edges||[]);
  if(visible){ [...doneSet].forEach(id=>{ if(!visible.has(id)) doneSet.delete(id); }); }
  const badge=step.stage||compName||(isScale?'Stage':'Flow');
  let cards='';
  (step.details||[]).forEach(d=>{

    cards+=`<div class="wt-card ${k}"><div class="h"><i class="ti ${WT_ICON[k]||'ti-info-circle'}"></i>${d.label||k}${d.pill?`<span class="pill">${d.pill}</span>`:''}</div>`;
    if(d.text) cards+=`<div class="tx">${wtInline(d.text)}</div>`;
    if(d.code) cards+=`<pre><code>${wtHi(d.code)}</code></pre>`;
    cards+=`</div>`;
  });
  const dots=f.steps.map((s,k)=>`<button class="dot ${k===i?'on':(state.wt.seen.has(k)?'seen':'')}" data-k="${k}" title="${(s.title||('Step '+(k+1))).replace(/"/g,'')}"></button>`).join('');
  const html=`<div class="wt-modal${isScale?' scale':''}" onclick="event.stopPropagation()">
    <div class="wt-head">
      <h3><i class="ti ${isScale?'ti-trending-up':'ti-route'}"></i>${f.name}</h3>
      <span class="sub">${p.title||''}</span>
      <span class="sp"></span>
      <span class="stepn">Step ${i+1} / ${n}</span>
      <button class="wt-x" id="wtclose" title="Close (Esc)">✕</button>
    </div>
    <div class="wt-body">
      <div class="wt-diag">
        <div class="d" id="wtdiagram">${flowDiagramSVG(p,activeId,fromId,doneSet,{visible,extraEdges})}</div>
        <div class="cap">${f.summary?wtInline(f.summary):'End-to-end request path — follow the glowing request as it moves between components.'}</div>
      </div>
      <div class="wt-side">
        <div class="wt-scroll">
          <span class="wt-badge${isScale?' stage':''}"><i class="ti ${isScale?'ti-stairs-up':'ti-friends'}"></i>${badge}</span>
          <h2 class="wt-title">${step.title||''}</h2>
          <div class="wt-narr">${wtInline(step.narrate||'')}</div>
          ${cards}
          ${step.snap?wtStateHTML(step.snap):''}
        </div>
        <div class="wt-nav">
          <button id="wtprev" ${i===0?'disabled':''}><i class="ti ti-chevron-left"></i> Prev</button>
          <button id="wtplay">${state.wt.playing?'<i class="ti ti-player-pause"></i> Pause':'<i class="ti ti-player-play"></i> Auto-play'}</button>
          <span class="sp"></span>
          <div class="wt-dots">${dots}</div>
          <span class="sp"></span>
          <button id="wtnext" class="prim" ${i>=n-1?'disabled':''}>Next <i class="ti ti-chevron-right"></i></button>
        </div>
      </div>
    </div>`;
  const ov=document.getElementById('wtov'); ov.innerHTML=html;
  document.getElementById('wtclose').onclick=closeWalk;
  document.getElementById('wtprev').onclick=()=>{ wtStopPlay(); wtGo(-1); };
  document.getElementById('wtnext').onclick=()=>{ wtStopPlay(); wtGo(1); };
  document.getElementById('wtplay').onclick=wtPlayToggle;
  ov.querySelectorAll('.wt-dots .dot').forEach(el=>el.onclick=()=>{ wtStopPlay(); wtJump(parseInt(el.dataset.k)); });
  ov.querySelectorAll('#wtdiagram .node').forEach(el=>el.onclick=()=>{ const idx=f.steps.findIndex(s=>(s.node||s.to)===el.dataset.node); if(idx>=0){ wtStopPlay(); wtJump(idx);} });
  if(fromId&&activeId&&fromId!==activeId) setTimeout(()=>wtPulse(fromId,activeId),260);
}
document.addEventListener('keydown',(e)=>{
  if(!state.wt||!state.wt.open) return;
  if(e.key==='Escape') closeWalk();
  else if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); wtStopPlay(); wtGo(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); wtStopPlay(); wtGo(-1); }
});

/* ---------------- diagram ---------------- */
// classify a component into a visual "tier" so the diagram is colour-coded like a Hello-Interview sketch
const NODE_KINDS=[
  {k:'client', c:'#6ea8ff', re:/client|user|browser|mobile|\bapp\b|seed|player/i},

  {k:'cache',  c:'#f0a742', re:/cache|redis|memcache/i},
  {k:'queue',  c:'#a78bfa', re:/queue|kafka|stream|broker|pubsub|topic|\bsqs\b|kinesis|fanout|dead|notif|\bpush\b/i},
  {k:'db',     c:'#4fd1a1', re:/\bdb\b|database|store|storage|\bsql\b|dynamo|cassandra|mongo|postgres|table|block|olap|persist|\bmeta\b|warehouse|blob|\bs3\b/i},

function kindOf(n){ const s=(n.id+' '+n.name+' '+(n.sub||'')); return NODE_KINDS.find(t=>t.re.test(s)); }
// point where the ray from a box centre toward a target meets the box border (pushed out by gap)
function borderPt(cx,cy,tx,ty,hw,hh,gap){
  const dx=tx-cx, dy=ty-cy, len=Math.hypot(dx,dy)||1;
  const s=Math.min(Math.abs(dx)>1e-6?hw/Math.abs(dx):1e9, Math.abs(dy)>1e-6?hh/Math.abs(dy):1e9);
  const t=s+(gap||0)/len;
  return {x:cx+dx*t, y:cy+dy*t};
}
function renderDiagram(){
  const p=DATA[state.prob], cellW=134, cellH=56, hw=cellW/2, hh=cellH/2;
  const maxX=Math.max(...p.nodes.map(n=>n.x))+cellW+40, maxY=Math.max(...p.nodes.map(n=>n.y))+cellH+30;
  const pos={}; p.nodes.forEach(n=>pos[n.id]={x:n.x,y:n.y});
  let edges='', elabels='';
  p.edges.forEach(e=>{ const [a,b,label]=e; if(!state.revealed.has(a)||!state.revealed.has(b))return; const A=pos[a],B=pos[b];
    const ax=A.x+hw, ay=A.y+hh, bx=B.x+hw, by=B.y+hh;
    const s=borderPt(ax,ay,bx,by,hw,hh,2), t=borderPt(bx,by,ax,ay,hw,hh,5);
    const isNew=state.justRevealed.has(a)||state.justRevealed.has(b);
    edges+=`<line class="edge ${isNew?'new':''}" x1="${s.x.toFixed(1)}" y1="${s.y.toFixed(1)}" x2="${t.x.toFixed(1)}" y2="${t.y.toFixed(1)}"></line>`;
    if(label){ const mx=(s.x+t.x)/2, my=(s.y+t.y)/2, w=label.length*5.4+12;
      elabels+=`<g class="edge-lbl ${isNew?'new':''}"><rect class="elabel-bg" x="${(mx-w/2).toFixed(1)}" y="${(my-8).toFixed(1)}" width="${w.toFixed(1)}" height="16" rx="5"></rect><text class="elabel" x="${mx.toFixed(1)}" y="${(my+3).toFixed(1)}" text-anchor="middle">${label}</text></g>`; }
  });
  let nodes='';
  p.nodes.forEach(n=>{ if(!state.revealed.has(n.id))return;
    const hasQ=(p.q&&p.q[n.id]||[]).some(q=>DIFF_ALLOWED[state.diff].includes(q.l));
    const isNew=state.justRevealed.has(n.id);
    const cls=[(state.activeNode===n.id?'active':''),(state.answeredCount[n.id]>=1?'done':''),(isNew?'new':''),(state.flowNode===n.id?'flowon':'')].join(' ');
    const cnt=state.answeredCount[n.id]||0, kind=kindOf(n);
    const badge=cnt>0?`<text class="sub" x="${n.x+cellW-12}" y="${n.y+17}" text-anchor="end" style="fill:var(--cand)">${cnt}</text>`:'';
    nodes+=`<g class="node ${cls}" data-node="${n.id}" style="${(state.phase===4&&!hasQ)?'opacity:.5':''}">`+
      `<rect class="box" x="${n.x}" y="${n.y}" width="${cellW}" height="${cellH}" rx="11"></rect>`+
      `<rect class="stripe" x="${n.x+2.5}" y="${n.y+9}" width="3.5" height="${cellH-18}" rx="1.75" fill="${kind.c}"></rect>`+
      `<g class="ico" transform="translate(${n.x+12},${n.y+9}) scale(0.9)" fill="none" stroke="${kind.c}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[kind.k]}</g>`+
      `<text x="${n.x+34}" y="${n.y+21}">${n.name}</text>`+
      `<text class="sub" x="${n.x+13}" y="${n.y+42}">${n.sub}</text>${badge}</g>`; });
  const kindsUsed=[...new Set(p.nodes.filter(n=>state.revealed.has(n.id)).map(n=>kindOf(n).k))];
  const legend=`<div class="legend">`+kindsUsed.map(k=>`<span class="lg"><i style="background:${KC[k]}"></i>${KIND_LABEL[k]}</span>`).join('')+`</div>`;
  const defs=`<defs>`+
    `<linearGradient id="nodegrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232d3a"/><stop offset="1" stop-color="#171d27"/></linearGradient>`+
    `<filter id="nodeshadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000" flood-opacity="0.4"/></filter>`+
    `<marker id="arr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="var(--edge)"/></marker>`+
    `</defs>`;
  document.getElementById('diagram').innerHTML=`<svg viewBox="0 0 ${maxX} ${maxY}">${defs}${edges}${nodes}${elabels}</svg>`+legend;
  document.querySelectorAll('#diagram .node').forEach(el=>el.onclick=()=>{ if(state.playing)return; state.activeNode=el.dataset.node; if(state.phase!==4)setPhase(4); else{renderDiagram();renderPanel();} });
  const total=p.nodes.length, shown=state.revealed.size;
  const dh=document.getElementById('dhint'); if(dh) dh.textContent=shown<total?`${shown}/${total} components`:`all ${total} components`;
}

/* ---------------- panels per phase ---------------- */
function renderPanel(){
  const p=DATA[state.prob];
  if(state.phase===1) return renderRequirements(p);
  if(state.phase===2) return renderReqBuild(p);
  if(state.phase===3) return renderDives(p);
  return renderComponents(p);
}
function renderRequirements(p){
  const r=p.requirements||{};
  let html=`<div class="phead"><h4>Requirements</h4><span class="counter">the basic HLD is on the board</span></div>`;
  if(r.functional){ html+=`<div class="reqcol"><h5>Functional</h5>`; r.functional.forEach(x=>html+=`<div class="reqli"><i class="ti ti-check"></i><span>${x}</span></div>`); html+=`</div>`; }
  if(r.nonFunctional){ html+=`<div class="reqcol"><h5>Non-functional</h5>`; r.nonFunctional.forEach(x=>html+=`<div class="reqli"><i class="ti ti-bolt"></i><span>${x}</span></div>`); html+=`</div>`; }
  html+=`<div class="tip">Next: <b>Functional HLD</b> — build the diagram so it satisfies each functional requirement.</div>`;
  document.getElementById('panel').innerHTML=html;
  document.getElementById('ptip').textContent='';
}
function renderReqBuild(p){
  const steps=p.reqBuild||[]; const done=Object.keys(state.reqDone).length;
  let html=`<div class="phead"><h4>Build the functional HLD</h4><span class="counter">${done}/${steps.length} requirements addressed</span></div>`;
  steps.forEach((s,i)=>{ const d=state.reqDone[i]; const rev=(s.reveal&&s.reveal.some(id=>!state.revealed.has(id)))?` <i class="ti ti-circle-plus" style="color:var(--accent2)"></i>`:'';
    html+=`<button class="item" data-i="${i}" ${d||state.playing?'disabled':''}><span class="chip req">req ${i+1}</span><span class="qt">${s.req}${rev}${d?' <span style="color:var(--cand)">✓</span>':''}</span><span class="turns">${Math.ceil((s.turns||[]).length/2)}×</span></button>`; });
  if(done>=steps.length&&steps.length) html+=`<div class="tip" style="color:var(--cand)">Functional HLD complete — every requirement is satisfied. Move to <b>System deep dives</b>.</div>`;
  document.getElementById('panel').innerHTML=html;
  document.getElementById('ptip').textContent='Address each functional requirement; the diagram grows to cover it.';
  document.querySelectorAll('#panel .item').forEach(el=>el.onclick=()=>{ if(!el.disabled) playReqStep(parseInt(el.dataset.i)); });
}
function renderDives(p){
  const dives=p.systemDives||[]; const done=Object.keys(state.diveDone).length;
  let html=`<div class="phead"><h4>System-wide deep dives</h4><span class="counter">${done}/${dives.length} explored</span></div>`;
  dives.forEach((s,i)=>{ const d=state.diveDone[i]; const tag=s.tag||'scaling';
    const rev=(s.reveal&&s.reveal.some(id=>!state.revealed.has(id)))?` <i class="ti ti-circle-plus" style="color:var(--accent2)"></i>`:'';
    html+=`<button class="item" data-i="${i}" ${state.playing?'disabled':''}><span class="tchip ${tag}"><i class="ti ${TAGS[tag]?TAGS[tag].icon:'ti-bulb'}"></i> ${tag}</span><span class="qt">${s.title}${rev}${d?' <span style="color:var(--cand)">✓</span>':''}</span><span class="turns">${Math.ceil((s.turns||[]).length/2)}×</span></button>`; });
  document.getElementById('panel').innerHTML=html+askBoxHTML('the whole system','system');
  document.getElementById('ptip').innerHTML='These evolve the architecture. Next: <b>Component deep dives</b> to drill each box.';
  document.querySelectorAll('#panel .item').forEach(el=>el.onclick=()=>{ if(!el.disabled) playDive(parseInt(el.dataset.i)); });
  wireAsk('system');
}
function renderComponents(p){
  const nid=state.activeNode;
  let html=`<div class="compbar">`;
  p.nodes.forEach(n=>{ if(!state.revealed.has(n.id))return; const hasQ=(p.q&&p.q[n.id]||[]).some(q=>DIFF_ALLOWED[state.diff].includes(q.l)); const hasDD=!!(p.deepDive||{})[n.id]; if(!hasQ&&!hasDD)return;
    html+=`<button class="compbtn ${nid===n.id?'on':''} ${state.answeredCount[n.id]?'done':''}" data-n="${n.id}">${n.name}${state.answeredCount[n.id]?' ·'+state.answeredCount[n.id]:''}</button>`; });
  html+=`</div>`;
  if(!nid){ html+=`<div class="empty">Pick a component (above or in the diagram) to drill in. Each one has <b><i class="ti ti-book-2"></i> Study notes</b> — role, capacity, data &amp; consistency, scaling, failure modes, trade-offs and interviewer probes — and an <b><i class="ti ti-messages"></i> Interview Q&amp;A</b> tab.</div>`; document.getElementById('panel').innerHTML=html; document.getElementById('ptip').innerHTML='Tip: <b>Study notes</b> is the deep reference; toggle to <b>Interview Q&amp;A</b> to be grilled. Chips: <span style="color:var(--t-concept)">concept</span>, <span style="color:var(--t-capacity)">capacity</span>, <span style="color:var(--t-scaling)">scaling</span>, <span style="color:var(--t-durability)">durability</span>, <span style="color:var(--t-failover)">failover</span>.'; document.querySelectorAll('#panel .compbtn').forEach(el=>el.onclick=()=>{state.activeNode=el.dataset.n;renderDiagram();renderPanel();}); return; }

  const wireCommon=()=>{
    document.querySelectorAll('#panel .compbtn').forEach(el=>el.onclick=()=>{state.activeNode=el.dataset.n;state.filter=null;renderDiagram();renderPanel();});
    document.querySelectorAll('#panel .mt').forEach(el=>el.onclick=()=>{state.studyMode=(el.dataset.m==='study');renderPanel();});
    wireAsk(nid);
  };
  if(dd&&state.studyMode){
    html+=`<div class="phead"><h4>${node.name} <span style="color:var(--muted);font-weight:400;font-size:12px">— study notes</span></h4><span class="counter">deep reference</span></div>`+toggle+renderStudyNotes(dd)+askBoxHTML(node.name,nid);
    document.getElementById('panel').innerHTML=html;
    document.getElementById('ptip').innerHTML='Deep reference — role, capacity, data &amp; consistency, scaling, <span style="color:var(--t-failover)">failure modes</span>, trade-offs, and what gets probed next.';
    wireCommon(); return;
  }
  let all=(p.q[nid]||[]).filter(q=>DIFF_ALLOWED[state.diff].includes(q.l));
  const tagsP=[...new Set(all.map(q=>q.tag||'concept'))];
  if(state.filter) all=all.filter(q=>(q.tag||'concept')===state.filter);
  const answered=state.answeredCount[nid]||0, capped=answered>=MAX_FOLLOWUPS;
  html+=`<div class="phead"><h4>${node.name}</h4><span class="counter">${answered}/${MAX_FOLLOWUPS} asked${capped?' · max':''}</span></div>`+toggle;
  if(tagsP.length>1){ html+=`<div class="filters"><button class="fchip ${!state.filter?'on':''}" data-f="">all</button>`; tagsP.forEach(t=>html+=`<button class="fchip ${state.filter===t?'on':''}" data-f="${t}"><i class="ti ${TAGS[t]?TAGS[t].icon:'ti-bulb'}"></i> ${t}</button>`); html+=`</div>`; }
  all.forEach(q=>{ const gi=p.q[nid].indexOf(q),key=nid+':'+gi,asked=state.asked[key],dis=asked||(capped&&!asked)||state.playing,tag=q.tag||'concept';
    const rev=(q.reveal&&q.reveal.some(id=>!state.revealed.has(id)))?` <i class="ti ti-circle-plus" style="color:var(--accent2)"></i>`:'';
    html+=`<button class="item" data-idx="${gi}" ${dis?'disabled':''}><span class="chip ${q.l}">${q.l}</span><span class="tchip ${tag}"><i class="ti ${TAGS[tag]?TAGS[tag].icon:'ti-bulb'}"></i> ${tag}</span><span class="qt">${q.q}${rev}${asked?' <span style="color:var(--cand)">✓</span>':''}</span><span class="turns">${Math.ceil(q.turns.length/2)}×</span></button>`; });

  document.querySelectorAll('#panel .fchip').forEach(el=>el.onclick=()=>{state.filter=el.dataset.f||null;renderPanel();});
  document.querySelectorAll('#panel .item').forEach(el=>el.onclick=()=>{ if(!el.disabled) playThread(nid,parseInt(el.dataset.idx)); });
