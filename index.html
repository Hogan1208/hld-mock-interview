}

function studySection(cls,icon,title,inner){ return `<div class="sect ${cls}"><h5><i class="ti ${icon}"></i>${title}</h5><div class="body">${inner}</div></div>`; }
function renderStudyNotes(dd){
  let h='<div class="study">';
  if(dd.role) h+=studySection('role','ti-focus-2','Role &amp; responsibility',dd.role);
  if(dd.capacity&&dd.capacity.length){ const rows=dd.capacity.map(r=>`<tr><td class="m">${r[0]}</td><td class="v">${r[1]}${r[2]?` <span class="n">· ${r[2]}</span>`:''}</td></tr>`).join(''); h+=`<div class="sect capacity"><h5><i class="ti ti-calculator"></i>Capacity &amp; numbers</h5><table class="captbl">${rows}</table></div>`; }
  if(dd.data) h+=studySection('data','ti-database','Data model &amp; consistency',dd.data);
  if(dd.scaling&&dd.scaling.length) h+=studySection('scaling','ti-trending-up','Scaling levers','<ul>'+dd.scaling.map(x=>`<li>${x}</li>`).join('')+'</ul>');
  if(dd.failures&&dd.failures.length){ const f=dd.failures.map(x=>`<div class="fail"><div class="ft"><i class="ti ti-alert-triangle"></i>${x.t}</div><div class="frow"><b>blast</b>${x.b}</div><div class="frow mit"><b>mitigation</b>${x.m}</div></div>`).join(''); h+=`<div class="sect failures"><h5><i class="ti ti-alert-triangle"></i>Failure modes &amp; mitigations</h5>${f}</div>`; }
  if(dd.tradeoffs&&dd.tradeoffs.length){ const tr=dd.tradeoffs.map(x=> typeof x==='string'?`<div class="trade">${x}</div>`:`<div class="trade"><span class="tw">${x.a}</span> vs <span class="tw">${x.b}</span> — ${x.pick}</div>`).join(''); h+=`<div class="sect tradeoffs"><h5><i class="ti ti-arrows-left-right"></i>Key trade-offs</h5>${tr}</div>`; }
  if(dd.probes&&dd.probes.length){ const pr=dd.probes.map(x=>`<div class="probe"><i class="ti ti-chevron-right"></i><span>${x}</span></div>`).join(''); h+=`<div class="sect probes"><h5><i class="ti ti-message-2-question"></i>The interviewer will probe next</h5>${pr}</div>`; }
  return h+'</div>';
}

/* ---------------- playback ---------------- */
function applyReveal(list){ state.justRevealed=new Set(); (list||[]).forEach(id=>{ if(!state.revealed.has(id)){state.revealed.add(id);state.justRevealed.add(id);} }); }
function playTurns(item, tagLabel, after){
  state.playing=true; renderStepper(); renderPanel();
  applyReveal(item.reveal); renderDiagram();
  const turns=item.turns||[]; let i=0;
  const step=()=>{ if(i>=turns.length){ if(state.justRevealed.size){ const names=[...state.justRevealed].map(id=>DATA[state.prob].nodes.find(n=>n.id===id).name).join(', '); addReveal(names);} if(item.resources&&item.resources.length)addResources(item.resources); state.playing=false; state.justRevealed=new Set(); if(after)after(); renderStepper(); renderDiagram(); renderPanel(); return; }
    const t=turns[i]; const prefix=(i===0&&tagLabel)?`<span style="color:var(--muted);font-size:11px">${tagLabel}</span><br>`:''; showTyping(t.who);
    const d=i===0?120:(t.who==='cand'?640:470); setTimeout(()=>{clearTyping();addBubble(t.who,prefix+t.text);i++;step();},d); };
  step();
}
function playReqStep(i){ const p=DATA[state.prob], s=p.reqBuild[i]; state.reqDone[i]=true; playTurns(s, `[requirement ${i+1}]`); }
function playDive(i){ const p=DATA[state.prob], s=p.systemDives[i]; state.diveDone[i]=true; playTurns(s, `[system deep dive · ${s.tag||''}]`); }
function playThread(nid,idx){ const p=DATA[state.prob], item=p.q[nid][idx]; state.asked[nid+':'+idx]=true; state.answeredCount[nid]=(state.answeredCount[nid]||0)+1; const node=p.nodes.find(n=>n.id===nid); playTurns(item, `[${node.name} · ${item.tag||'concept'} · ${item.l}]`, ()=>appendQuizPrompt(nid, item)); }

let typingEl=null;
function showTyping(who){ const t=document.getElementById('transcript'); typingEl=document.createElement('div'); typingEl.className=`bubble ${who}`; typingEl.innerHTML=`<div class="who"><span class="av">${who==='intv'?'I':'C'}</span>${who==='intv'?'Interviewer':'Candidate'}</div><div class="body"><div class="typing"><span></span><span></span><span></span></div></div>`; t.appendChild(typingEl); t.scrollTop=t.scrollHeight; }
function clearTyping(){ if(typingEl){typingEl.remove();typingEl=null;} }
function addBubble(who,body){ const t=document.getElementById('transcript'); if(t.querySelector('.empty-t'))t.innerHTML=''; const label=who==='intv'?'Interviewer':(who==='you'?'You (interviewer)':'Candidate'); const md=body.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); const div=document.createElement('div'); div.className=`bubble ${who}`; div.innerHTML=`<div class="who"><span class="av">${who==='intv'?'I':(who==='you'?'Y':'C')}</span>${label}</div><div class="body">${md}</div>`; t.appendChild(div); t.scrollTop=t.scrollHeight; document.getElementById('tcount').textContent=`${t.querySelectorAll('.bubble').length} messages`; return div; }
function addReveal(names){ const t=document.getElementById('transcript'); const d=document.createElement('div'); d.className='reveal-note'; d.innerHTML=`<i class="ti ti-circle-plus"></i> Diagram updated — added: <strong style="color:#fff">${names}</strong>`; t.appendChild(d); t.scrollTop=t.scrollHeight; }
function addResources(list){ const t=document.getElementById('transcript'); const d=document.createElement('div'); d.className='res'; const links=list.map(r=>{let host='';try{host=new URL(r.url).hostname.replace('www.','');}catch(e){} return `<a href="${r.url}" target="_blank" rel="noopener"><i class="ti ti-external-link" style="font-size:14px"></i><span>${r.title}<br><span class="d">${host}</span></span></a>`;}).join(''); d.innerHTML=`<div class="rh"><i class="ti ti-book"></i>Resources &amp; further reading</div>${links}`; t.appendChild(d); t.scrollTop=t.scrollHeight; }

/* ---------------- live ask (answered in-app by Claude in the background) ---------------- */
function askBoxHTML(scopeLabel,scopeId){ return `<div class="askbox"><label>Ask your own question about <b>${scopeLabel}</b> — answered instantly from the study notes. Or <b>flip it</b>: let me quiz you and grade your answer.</label><div class="askrow"><textarea id="askText" placeholder="e.g. How would you handle a poison-pill event stuck in the pipeline?"></textarea><button class="go" id="askGo">Ask ↗</button></div><div style="margin-top:8px"><button class="quizme" id="quizGo" data-scope="${scopeId||'system'}"><i class="ti ti-help-circle"></i> Quiz me on ${scopeLabel} ↳</button></div></div>`; }
function wireAsk(scopeId){ const go=document.getElementById('askGo'); if(go){ go.onclick=()=>submitAsk(scopeId); const ta=document.getElementById('askText'); if(ta) ta.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter') submitAsk(scopeId); }); } const q=document.getElementById('quizGo'); if(q) q.onclick=()=>quizMe(scopeId); }
/* ---------------- local answer engine (offline; synthesized from each problem's curated study data) ---------------- */
const ASK_STOP=new Set("the a an and or of to in on for with is are be as at by from it its this that these those you your we our they their how what why when which who where do does did can could should would will if then else than so not no into over under about across via per vs versus use used using here there them then also more most much many few some any".split(" "));
function askToks(s){ return String(s||"").toLowerCase().replace(/<[^>]+>/g," ").replace(/[^a-z0-9]+/g," ").split(" ").filter(function(w){return w.length>2 && !ASK_STOP.has(w);}); }
function askScore(qt,text,boost){ var tt=askToks(text); if(!tt.length) return 0; var set={}; tt.forEach(function(t){set[t]=1;}); var s=0; qt.forEach(function(w){ if(set[w]) s+=2; else if(tt.some(function(t){return t.indexOf(w)>=0||w.indexOf(t)>=0;})) s+=1; }); return s*(boost||1); }
function askBestBy(arr,fn,qt){ var b=null,bs=-1; (arr||[]).forEach(function(x){ var s=askScore(qt,fn(x),1); if(s>bs){bs=s;b=x;} }); return b; }
function askRankBy(arr,fn,qt){ return (arr||[]).map(function(x){return {x:x,s:askScore(qt,fn(x),1)};}).sort(function(a,b){return b.s-a.s;}).map(function(o){return o.x;}); }
function askIntent(q){ var s=" "+String(q).toLowerCase()+" "; function has(){for(var i=0;i<arguments.length;i++){if(s.indexOf(arguments[i])>=0)return true;}return false;} var it=[];
  if(has("fail","crash","down","outage","lost","lose","recover","retry","poison","dead","timeout","duplicat","node loss","leak","corrupt")) it.push("failures");
  if(has("scale","scaling","throughput","hot ","load","shard","qps","rps","bottleneck","burst","spike","partition","fan-out","fanout")) it.push("scaling");
  if(has("consist","replicat","sync","async","quorum","transaction","acid","isolation","stale","durab","oversell","atomic","lock","idempot","conflict")) it.push("data");
  if(has("trade","vs ","versus","why not","instead","choose","choice","compare","alternativ","pros","cons","better","rather")) it.push("tradeoffs");
  if(has("how many","capacity","sizing","storage","bytes","memory","estimate","back-of","how much","number of","how big","throughput per")) it.push("capacity");
  return it; }
function askDDParts(dd,intents,qt){ var parts=[]; function wants(k){return intents.indexOf(k)>=0;}
  if(!intents.length){ if(dd.role)parts.push(dd.role); if(dd.data)parts.push("<b>Data &amp; consistency:</b> "+dd.data); if(dd.scaling&&dd.scaling[0])parts.push("<b>Main scaling lever:</b> "+dd.scaling[0]); return parts; }
  if(wants("failures")&&dd.failures&&dd.failures.length){ var f=askBestBy(dd.failures,function(x){return x.t+" "+x.b+" "+x.m;},qt)||dd.failures[0]; parts.push("<b>Failure &mdash; "+f.t+":</b> "+f.b+" <b>Mitigation:</b> "+f.m); }
  if(wants("scaling")&&dd.scaling&&dd.scaling.length){ var top=askRankBy(dd.scaling,function(x){return x;},qt).slice(0,2); parts.push("<b>Scaling levers:</b><br>&bull; "+top.join("<br>&bull; ")); }
  if(wants("data")&&dd.data){ parts.push("<b>Data &amp; consistency:</b> "+dd.data); }
  if(wants("tradeoffs")&&dd.tradeoffs&&dd.tradeoffs.length){ var t=askBestBy(dd.tradeoffs,function(x){return x.a+" "+x.b+" "+x.pick;},qt)||dd.tradeoffs[0]; parts.push("<b>Trade-off &mdash; "+t.a+" vs "+t.b+":</b> "+t.pick); }
  if(wants("capacity")&&dd.capacity&&dd.capacity.length){ parts.push("<b>Capacity:</b> "+dd.capacity.map(function(c){return c[0]+" &asymp; "+c[1]+(c[2]?" ("+c[2]+")":"");}).join("; ")); }
  if(!parts.length){ if(dd.role)parts.push(dd.role); if(dd.data)parts.push("<b>Data &amp; consistency:</b> "+dd.data); }
  return parts; }
function localAnswer(scopeId,question){ var p=DATA[state.prob]; var qt=askToks(question); var intents=askIntent(question);
  var nid = scopeId!=="system" ? scopeId : null;
  var nodeName = nid ? ((p.nodes.find(function(n){return n.id===nid;})||{}).name||nid) : "the overall system";
  var out=[]; var qmap=p.q||{}; var threads=[];
  (nid?[nid]:Object.keys(qmap)).forEach(function(k){ (qmap[k]||[]).forEach(function(it){ threads.push({k:k,it:it}); }); });
  (p.systemDives||[]).forEach(function(sd){ threads.push({k:null,it:{q:sd.title,turns:sd.turns}}); });
  var best=null,bestScore=0;
  threads.forEach(function(o){ var sc=askScore(qt,o.it.q,3)+askScore(qt,(o.it.turns||[]).map(function(t){return t.text;}).join(" "),1); if(sc>bestScore){bestScore=sc;best=o;} });
  if(best&&bestScore>=4){ var cand=(best.it.turns||[]).filter(function(t){return t.who==="cand";}).map(function(t){return t.text;}); if(cand.length) out.push(cand.slice(0,2).join("<br><br>")); }
  if(nid&&p.deepDive&&p.deepDive[nid]){ askDDParts(p.deepDive[nid],intents,qt).forEach(function(x){ var head=x.slice(0,44); if(!out.some(function(o){return o.indexOf(head)>=0;})) out.push(x); }); }
  if(!nid&&!out.length){ var r=(p.requirements&&p.requirements.functional)||[]; if(r.length) out.push("<b>Core requirements:</b><br>&bull; "+r.slice(0,4).join("<br>&bull; ")); }
  if(!out.length){ var dd=nid&&p.deepDive?p.deepDive[nid]:null; if(dd&&dd.role) out.push(dd.role); else out.push("Focus on "+nodeName+": its role, the data and consistency it owns, how it scales, and its main failure mode. Try this component&rsquo;s Q&amp;A threads, or ask something specific &mdash; e.g. how it handles failure, scaling, or consistency."); }
  var tag=intents.length?" &middot; "+intents.join(", "):"";
  var note="<div style=\"color:var(--muted);font-size:11px;margin-bottom:6px\"><i class=\"ti ti-book\"></i> On <b>"+nodeName+"</b> &mdash; from this problem&rsquo;s study notes"+tag+"</div>";
  return note+out.join("<br><br>"); }
function localGrade(model,user){ var mt=askToks(model); var uset={}; askToks(user).forEach(function(u){uset[u]=1;});
  var freq={}; mt.forEach(function(w){freq[w]=(freq[w]||0)+1;}); var ranked=Object.keys(freq).sort(function(a,b){return freq[b]-freq[a];});
  var key=ranked.slice(0,8); var uarr=Object.keys(uset);
  function hitFn(w){ return !!uset[w] || uarr.some(function(u){return u.indexOf(w)>=0||w.indexOf(u)>=0;}); }
  var hit=key.filter(hitFn); var miss=key.filter(function(w){return !hitFn(w);});
  var cov=key.length?hit.length/key.length:0;
  var verdict=cov>=0.5?"<strong>Correct</strong>":cov>=0.25?"<strong>Partially correct</strong>":"<strong>Needs work</strong>";
  var msg=verdict+" &mdash; ";
  msg+= hit.length? "you covered "+hit.slice(0,5).map(function(w){return "<code>"+w+"</code>";}).join(", ")+". " : "your answer missed the key ideas. ";
  if(miss.length) msg+="Also address "+miss.slice(0,5).map(function(w){return "<code>"+w+"</code>";}).join(", ")+".";
  msg+="<br><span style=\"color:var(--muted);font-size:11px\">heuristic self-check against the model answer above &mdash; compare directly for the full picture.</span>";
  return msg; }
function submitAsk(scopeId){
  var ta=document.getElementById("askText"); var txt=(ta.value||"").trim(); if(!txt)return;
  var p=DATA[state.prob];
  var scopeName= scopeId==="system" ? "the overall system" : ((p.nodes.find(function(n){return n.id===scopeId;})||{}).name||scopeId);
  var id="q_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
  addBubble("you","<span style=\"color:var(--muted);font-size:11px\">[your question &middot; "+scopeName+"]</span><br>"+txt);
  var t=document.getElementById("transcript"); var live=document.createElement("div"); live.className="bubble cand live"; live.id="live-"+id;
  live.innerHTML="<div class=\"who\"><span class=\"av\">C</span>Candidate</div><div class=\"body\"><div class=\"typing\"><span></span><span></span><span></span></div></div>";
  t.appendChild(live); t.scrollTop=t.scrollHeight; ta.value="";
  var revealed=p.nodes.filter(function(n){return state.revealed.has(n.id);}).map(function(n){return n.name;}).join(", ");
  var ctx="Problem \""+p.title+"\". Focus "+scopeName+". Board: "+revealed+". Difficulty "+state.diff+".";
  try{ fetch("/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id,q:txt,ctx:ctx})}).catch(function(){}); }catch(e){}
  var ans=localAnswer(scopeId,txt);
  setTimeout(function(){ var el=document.getElementById("live-"+id); if(el){ el.querySelector(".body").innerHTML=ans; el.classList.remove("live"); document.getElementById("transcript").scrollTop=1e9; } },500);
}
function pollAnswer(id,tries){
  if(tries>90){ const el=document.getElementById('live-'+id); if(el)el.querySelector('.body').innerHTML="<em>Still thinking — the answer will appear here shortly. (If it doesn't, Claude may not be actively watching this session.)</em>"; return; }
  fetch('/poll').then(r=>r.json()).then(m=>{ if(m[id]){ const el=document.getElementById('live-'+id); if(el){ const md=m[id].replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); el.querySelector('.body').innerHTML=md; el.classList.remove('live'); const t=document.getElementById('transcript'); t.scrollTop=t.scrollHeight; } } else setTimeout(()=>pollAnswer(id,tries+1),1500); }).catch(()=>setTimeout(()=>pollAnswer(id,tries+1),1500));
}

/* ---------------- live exchange bridge (shared) ---------------- */
function liveExchange(opts){
  const id='q_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  const t=document.getElementById('transcript');
  const who=opts.who||'cand', label=who==='intv'?'Interviewer':'Candidate';
  const b=document.createElement('div'); b.className='bubble '+who+' live'; b.id='live-'+id;
  b.innerHTML=`<div class="who"><span class="av">${who==='intv'?'I':'C'}</span>${label}</div><div class="body"><div class="typing"><span></span><span></span><span></span></div></div>`;
  t.appendChild(b); t.scrollTop=t.scrollHeight;
  fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,q:opts.question,ctx:opts.ctx})}).catch(()=>{});
  pollExchange(id,0,opts.onDone);
}
function pollExchange(id,tries,onDone){
  if(tries>120){ const el=document.getElementById('live-'+id); if(el)el.querySelector('.body').innerHTML="<em>No live answer yet — this needs the local server running with Claude watching the session.</em>"; return; }
  fetch('/poll').then(r=>r.json()).then(m=>{ if(m[id]){ const el=document.getElementById('live-'+id); const md=m[id].replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); if(el){el.querySelector('.body').innerHTML=md; el.classList.remove('live');} document.getElementById('transcript').scrollTop=1e9; if(onDone)onDone(m[id]); } else setTimeout(()=>pollExchange(id,tries+1,onDone),1500); }).catch(()=>setTimeout(()=>pollExchange(id,tries+1,onDone),1500));
}
function renderAnswerBox(onSubmit){
  removeAnswerBox();
  const t=document.getElementById('transcript');
  const d=document.createElement('div'); d.className='answerbox'; d.id='answerbox';
  d.innerHTML=`<textarea id="ansText" placeholder="Type your answer — you're the candidate now. (Cmd/Ctrl+Enter to submit)"></textarea><button class="go" id="ansGo">Submit ↗</button>`;
  t.appendChild(d); t.scrollTop=1e9; const ta=document.getElementById('ansText'); ta.focus();
  document.getElementById('ansGo').onclick=onSubmit;
  ta.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter') onSubmit(); });
}
function removeAnswerBox(){ const e=document.getElementById('answerbox'); if(e)e.remove(); }

/* ---------------- quiz-me (test yourself on a topic) ---------------- */
/* Token-lean: questions + model answers are pre-authored (0 tokens). Only the
   optional "Ask AI to grade" button spends tokens (one live call), on demand. */
function pickCanned(){
  const p=DATA[state.prob], bank=(p.mockTest||[]);
  if(!bank.length) return null;
  state.quizUsed=state.quizUsed||new Set();
  let pool=bank.map((x,i)=>i).filter(i=>!state.quizUsed.has(i));
  if(!pool.length){ state.quizUsed=new Set(); pool=bank.map((x,i)=>i); }
  const idx=pool[Math.floor(Math.random()*pool.length)];
  state.quizUsed.add(idx); return bank[idx];
}
function showModelAnswer(a){
  const t=document.getElementById('transcript');
  const mb=document.createElement('div'); mb.className='bubble model';
  mb.innerHTML=`<div class="who"><span class="av" style="background:#7ad">A</span>Model answer</div><div class="body">${(a||'').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</div>`;
  t.appendChild(mb); t.scrollTop=1e9;
}
function offerActions(item,userAns,withNext){
  const t=document.getElementById('transcript');
  const d=document.createElement('div'); d.className='quizprompt';
  d.innerHTML=`<button class="g"><i class="ti ti-robot"></i> Grade my answer ↳ <span style="color:var(--muted)">(instant)</span></button>${withNext?` <button class="n">Next question ▶</button>`:''}`;
  t.appendChild(d);
  d.querySelector('.g').onclick=()=>{ const g=d.querySelector('.g'); g.remove(); gradeWithAI(item.q,item.a,userAns); };
  const n=d.querySelector('.n'); if(n) n.onclick=()=>{ d.remove(); state.mock.i++; askMockQuestion(); };
  t.scrollTop=1e9;
}
function gradeWithAI(q,a,v){
  var t=document.getElementById("transcript");
  var b=document.createElement("div"); b.className="bubble intv live";
  b.innerHTML="<div class=\"who\"><span class=\"av\">I</span>Interviewer</div><div class=\"body\"><div class=\"typing\"><span></span><span></span><span></span></div></div>";
  t.appendChild(b); t.scrollTop=1e9;
  setTimeout(function(){ b.querySelector(".body").innerHTML=localGrade(a,v); b.classList.remove("live"); document.getElementById("transcript").scrollTop=1e9; },450);
}
function quizMe(scopeId){
  if(state.playing)return;
  const item=pickCanned();
  if(!item){ addBubble('intv','No question bank for this problem yet.'); return; }
  state.quiz=item;
  addBubble('intv', `<span style="color:var(--muted);font-size:11px">[quiz]</span><br>${item.q}`);
  renderAnswerBox(submitQuizAnswer);
}
function submitQuizAnswer(){
  const ta=document.getElementById('ansText'); const v=(ta.value||'').trim(); if(!v)return;
  removeAnswerBox(); addBubble('you', v);
  showModelAnswer(state.quiz.a);
  offerActions(state.quiz, v, false);
}
function appendQuizPrompt(nid,item){
  const t=document.getElementById('transcript');
  const d=document.createElement('div'); d.className='quizprompt';
  d.innerHTML=`<button><i class="ti ti-help-circle"></i> Your turn — quiz me on this ↳</button>`;
  t.appendChild(d); d.querySelector('button').onclick=()=>{ d.remove(); quizMe(nid); };
  t.scrollTop=1e9;
}

/* ---------------- mock test (pre-authored; grading optional) ---------------- */
function startMockTest(){
  const p=DATA[state.prob];
  if(!p.mockTest||!p.mockTest.length){ addBubble('intv','No mock test authored for this problem yet.'); return; }
  state.mock={list:p.mockTest, i:0};
  addBubble('intv', `<strong>Mock test — ${p.mockTest.length} questions.</strong> Answer each as the candidate; you'll see the model answer instantly (free), and can optionally ask me to grade your specific answer. Here's the first.`);
  askMockQuestion();
}
function askMockQuestion(){
  const m=state.mock; if(!m)return;
  if(m.i>=m.list.length){ addBubble('intv', `<strong>That's the set.</strong> You worked through all ${m.list.length}. Compare your answers to the model answers above, and re-run any component's threads to shore up weak spots. Click <em>Mock test</em> again to retry.`); state.mock=null; return; }
  const q=m.list[m.i].q;
  addBubble('intv', `<span style="color:var(--muted);font-size:11px">[mock test · Q${m.i+1}/${m.list.length}]</span><br>${q}`);
  renderAnswerBox(submitMockAnswer);
}
function submitMockAnswer(){
  const ta=document.getElementById('ansText'); const v=(ta.value||'').trim(); if(!v)return;
  removeAnswerBox(); addBubble('you', v);
  const item=state.mock.list[state.mock.i];
  showModelAnswer(item.a);
  offerActions(item, v, true);
}

document.getElementById('resetBtn').onclick=()=>{ if(state.prob)startInterview(state.prob); };
document.getElementById('changeBtn').onclick=()=>{ renderSetup(); };
document.getElementById('mockBtn').onclick=()=>{ if(state.prob&&!state.playing) startMockTest(); };
renderSetup();
</script>
